# Builds the desktop app and the command line for Linux, macOS and Windows
# and publishes them as a GitHub release. Push a tag (git tag v0.2.0 &&
# git push origin v0.2.0).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - name: Command line
        shell: bash
        run: |
          cargo build --release --locked -p docex
          mkdir -p out
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          cp "target/release/docex$ext" "out/docex-${{ matrix.name }}$ext"
      - name: Desktop app
        shell: bash
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          npx tauri build
      - name: Collect
        shell: bash
        run: |
          shopt -s nullglob
          for f in target/release/bundle/{deb/*.deb,rpm/*.rpm,appimage/*.AppImage,dmg/*.dmg,msi/*.msi,nsis/*.exe}; do cp "$f" out/; done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "$GITHUB_REF_TYPE" != tag ]; then tag="nightly-$(date +%Y%m%d)-${GITHUB_SHA::7}"; fi
          gh release create "$tag" dist/* --generate-notes --target "$GITHUB_SHA" --title "docex $tag"
