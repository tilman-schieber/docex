[package]
name = "docex-gui"
version = "0.2.0"
edition = "2021"
license = "MIT"
# The app; src/bin/devserver.rs is the backend for browser tests.
default-run = "docex-gui"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
docex-core = { path = "../../crates/docex-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2", "system-proxy"] }
futures-util = "0.3.34"

# Spell checking: WebKitGTK's (the same crate Tauri's web view uses).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
